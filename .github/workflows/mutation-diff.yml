name: Mutation Tests (Pull Request)

# Plan V22 A17: mutates the modules a pull request changes and reports the
# undetected mutants in the job summary and as annotations on the changed
# lines. It has no break value, so a surviving mutant never fails it. It fails
# when Stryker itself cannot run, and when a mutant with status NoCoverage sits
# on a changed line (no test runs that line; approved deviation from A17,
# 2026-11-19, see docs/quality-gates.md). The full scheduled run is
# .github/workflows/mutation.yml.

# Runs on every pull request, not behind a paths filter, because the main
# ruleset requires this check and a required check that never reports blocks the
# merge. The "changes" step skips the work when no app file and not this
# workflow changed, and a job whose steps are skipped reports success.
on:
  pull_request:

permissions:
  contents: read

# A new push makes the run of the previous commit worthless.
concurrency:
  group: mutation-diff-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  diff:
    name: Mutation Of Changed Files
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Three-dot diff against the base, the same comparison a paths filter makes.
      - name: Detect app changes
        id: changes
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA"...HEAD -- app .github/workflows/mutation-diff.yml; then
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No app change: mutation testing skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.changes.outputs.app == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select pinned npm
        if: ${{ steps.changes.outputs.app == 'true' }}
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        if: ${{ steps.changes.outputs.app == 'true' }}
        run: npm ci
      - name: Run mutation tests on changed files
        if: ${{ steps.changes.outputs.app == 'true' }}
        run: npm run test:mutation:diff
      # The incremental file stands in for the report when the run was
      # interrupted at its time budget (DIFF_BUDGET_MINUTES).
      - name: Summarize
        if: ${{ !cancelled() && steps.changes.outputs.app == 'true' }}
        run: >-
          node scripts/mutation-summary.mjs
          reports/mutation/mutation.json
          reports/mutation/stryker-incremental.json
          --changed reports/mutation/changed-lines.json
      - name: Upload mutation report
        if: ${{ !cancelled() && steps.changes.outputs.app == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-diff
          path: app/reports/mutation/
          if-no-files-found: ignore
          retention-days: 7
