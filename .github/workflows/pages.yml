name: Validate And Deploy Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            script: lint
          - name: Typecheck
            script: typecheck
          - name: Unit Tests
            script: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select pinned npm
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        run: npm ci
      - name: Run check
        run: npm run ${{ matrix.script }}

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select pinned npm
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Share production build
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: app/dist
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser Tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select pinned npm
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        run: npm ci
      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: app/dist
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser loops and production-path smoke
        run: npm run test:e2e
      - name: Retain browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated build
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: app/dist
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist
      - name: Read existing Pages configuration
        uses: actions/configure-pages@v6
        with:
          enablement: false
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v5
