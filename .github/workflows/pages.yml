name: Validate And Deploy Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            script: lint
          - name: Typecheck
            script: typecheck
          - name: Unit Tests
            script: test
          - name: Audit
            script: audit
          - name: Simulated Soak
            script: test:soak:sim
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select pinned npm
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        run: npm ci
      - name: Run check
        run: npm run ${{ matrix.script }}

  bench:
    # Plan V22 A24: compares this pull request's benchmarks with its merge base
    # on the same runner, alternating base and head so runner noise hits both.
    # It runs on pull requests only, so it never gates `deploy`.
    name: Benchmark Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Provisional until the threshold is measured over three base-against-base
    # runs (see BENCH_REGRESSION_THRESHOLD in app/scripts/bench-gate.mjs); remove
    # this flag in the same change that records the measurements.
    continue-on-error: true
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: head
      - name: Check out the merge base
        run: |
          base="$(git -C head merge-base "origin/${{ github.base_ref }}" HEAD)"
          git -C head worktree add ../base "$base"
      - uses: actions/setup-node@v7
        with:
          node-version-file: head/.node-version
          cache: npm
          cache-dependency-path: head/app/package-lock.json
      - name: Select pinned npm
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        run: |
          npm ci --prefix head/app
          npm ci --prefix base/app
      - name: Run benchmarks alternately
        run: |
          for round in 1 2; do
            rm -rf base/app/reports/bench head/app/reports/bench
            npm run bench --prefix base/app || echo "base has no benchmarks"
            cp -r base/app/reports/bench "$RUNNER_TEMP/base-$round" || echo "base produced no results"
            npm run bench --prefix head/app
            cp -r head/app/reports/bench "$RUNNER_TEMP/head-$round"
          done
      - name: Compare
        run: |
          node head/app/scripts/bench-gate.mjs \
            --base "$RUNNER_TEMP/base-1" "$RUNNER_TEMP/base-2" \
            --head "$RUNNER_TEMP/head-1" "$RUNNER_TEMP/head-2"

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select pinned npm
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Share production build
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: app/dist
          if-no-files-found: error
          retention-days: 1

  browser:
    # The serial single-worker suite took about 10 minutes, a third of it in
    # three 60-second real-time soak tests. Playwright shards are contiguous
    # slices, so the @soak tests run as their own group, one per job, beside
    # three shards of everything else.
    name: Browser Tests (${{ matrix.group }} ${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [main, soak]
        shard: [1, 2, 3]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select pinned npm
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        run: npm ci
      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: app/dist
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser loops and production-path smoke
        run: >-
          npm run test:e2e --
          ${{ matrix.group == 'soak' && '--grep @soak' || '--grep-invert @soak' }}
          --shard=${{ matrix.shard }}/3
      - name: Retain browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}-${{ matrix.shard }}
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated build
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: app/dist
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist
      - name: Read existing Pages configuration
        uses: actions/configure-pages@v6
        with:
          enablement: false
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v5
